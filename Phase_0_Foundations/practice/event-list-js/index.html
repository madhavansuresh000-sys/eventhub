<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - JS practice</title>
  <style>
    :root { --brand: #4f46e5; --text: #1e293b; --muted: #64748b; --card: #ffffff; --bg: #f1f5f9; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e2e8f0; --muted: #94a3b8; --card: #0f172a; --bg: #020617; --line: #1e293b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    input, select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px;
                    background: var(--card); color: var(--text); }
    input { flex: 1; min-width: 200px; }
    .count { color: var(--muted); margin-bottom: 12px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .club { color: var(--brand); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .card h2 { font-size: 18px; margin: 4px 0 8px; }
    .meta { color: var(--muted); font-size: 14px; margin: 2px 0; }
    .badge { display: inline-block; margin-top: 10px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .ok { background: #dcfce7; color: #166534; }
    .full { background: #fee2e2; color: #991b1b; }
    .empty { padding: 32px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>EventHub events</h1>
    <p class="count">Phase 0 JavaScript practice: data comes from a JSON array, no backend.</p>

    <div class="tools">
      <label for="search" hidden>Search</label>
      <input id="search" type="search" placeholder="Search by name, club or venue...">
      <label for="tag" hidden>Tag</label>
      <select id="tag"><option value="">All tags</option></select>
    </div>

    <p id="count" class="count" aria-live="polite"></p>
    <div id="list" class="grid"></div>
  </main>

  <script>
    // 1. The data: a JSON array of event objects (later this comes from GET /api/events)
    const events = [
      { id: 1, title: 'Tech Fest 2026', club: 'Coding Club', venue: 'Main Auditorium', date: '2026-10-12', seatsLeft: 40, tags: ['tech', 'coding'] },
      { id: 2, title: '24-Hour Hackathon', club: 'Coding Club', venue: 'CSE Block Lab 1', date: '2026-10-20', seatsLeft: 10, tags: ['tech', 'competition'] },
      { id: 3, title: 'Dance Night', club: 'Cultural Club', venue: 'Open Air Theatre', date: '2026-10-15', seatsLeft: 0, tags: ['dance'] },
      { id: 4, title: 'Battle of Bands', club: 'Cultural Club', venue: 'Open Air Theatre', date: '2026-10-25', seatsLeft: 150, tags: ['music', 'competition'] },
      { id: 5, title: 'Inter-College Cricket Cup', club: 'Sports Club', venue: 'College Ground', date: '2026-10-18', seatsLeft: 320, tags: ['sports'] },
      { id: 6, title: 'Robo Race', club: 'Robotics Club', venue: 'Mechanical Block', date: '2026-10-22', seatsLeft: 48, tags: ['robotics', 'tech'] },
      { id: 7, title: 'Resume Clinic', club: 'Career Cell', venue: 'Seminar Hall B', date: '2026-10-16', seatsLeft: 18, tags: ['career'] },
    ];

    const searchBox = document.getElementById('search');
    const tagSelect = document.getElementById('tag');
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    // 2. Fill the tag dropdown: flatMap joins all tag arrays, Set removes duplicates, sort A-Z
    const allTags = [...new Set(events.flatMap(e => e.tags))].sort();
    allTags.forEach(tag => tagSelect.add(new Option(tag, tag)));

    // 3. One function that turns an event object into a card (built with DOM methods,
    //    so text from the data can never inject HTML)
    function createCard(event) {
      const card = document.createElement('article');
      card.className = 'card';

      const club = document.createElement('div');
      club.className = 'club';
      club.textContent = event.club;

      const title = document.createElement('h2');
      title.textContent = event.title;

      const when = document.createElement('p');
      when.className = 'meta';
      when.textContent = new Date(event.date).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

      const where = document.createElement('p');
      where.className = 'meta';
      where.textContent = event.venue;

      const badge = document.createElement('span');
      const full = event.seatsLeft === 0;
      badge.className = 'badge ' + (full ? 'full' : 'ok');
      badge.textContent = full ? 'SOLD OUT' : event.seatsLeft + ' seats left';

      card.append(club, title, when, where, badge);
      return card;
    }

    // 4. filter() keeps the matching events, sort() orders by date, then we draw them
    function render() {
      const text = searchBox.value.trim().toLowerCase();
      const tag = tagSelect.value;

      const matches = events
        .filter(e => (e.title + ' ' + e.club + ' ' + e.venue).toLowerCase().includes(text))
        .filter(e => tag === '' || e.tags.includes(tag))
        .sort((a, b) => a.date.localeCompare(b.date));

      count.textContent = matches.length + ' of ' + events.length + ' events';
      list.replaceChildren();
      if (matches.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No events match "' + searchBox.value + '".';
        list.append(empty);
        return;
      }
      matches.forEach(e => list.append(createCard(e)));
    }

    // 5. Draw again every time the user types or picks a tag
    searchBox.addEventListener('input', render);
    tagSelect.addEventListener('change', render);
    render();
  </script>
</body>
</html>
