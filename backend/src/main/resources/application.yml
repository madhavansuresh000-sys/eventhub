# ---------- Common settings (all profiles) ----------
server:
  port: ${PORT:8080}        # hosting platforms (Render) tell the app its port in PORT

spring:
  application:
    name: eventhub
  profiles:
    default: dev            # when no profile is chosen, use "dev"
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks them
    open-in-view: false
  flyway:
    enabled: true
  cache:
    # Phase 7 step 7: dashboard numbers are kept in memory for 60 s (see analytics/AnalyticsService)
    cache-names: analytics
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # everyone sees only "UP"/"DOWN"; the admin also sees database, mail and disk details
      show-details: when-authorized
      roles: ADMIN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Websites allowed to call the API from a browser (CorsConfig). Comma-separated.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    expiry: 8h              # how long a login lasts
  cookie:
    secure: false           # true in prod (cookie only over HTTPS)
  login:
    max-failures: 5         # wrong passwords before the account+address is locked for a while
    lock-time: 15m
  booking:
    hold-time: 10m          # how long seats are kept for a student who has not paid yet
    expiry-check: 60s       # how often the job frees expired holds
  waitlist:
    offer-time: 30m         # how long freed seats are kept for the next student on the waitlist
    expiry-check: 60s       # how often the job passes unanswered offers to the next student
  mail:
    enabled: ${MAIL_ENABLED:true}   # false = bell notifications only, no emails
    from: ${MAIL_FROM:EventHub <no-reply@eventhub.test>}
    retry-every: 60s        # emails that failed (mail server down) are tried again, up to 5 times
  reminders:
    cron: "0 0 18 * * *"    # every day at 18:00: reminders for tomorrow's events
    zone: Asia/Kolkata
  scheduling:
    enabled: true           # the every-minute job (tests switch it off)
  # where the React app runs: Stripe sends the student back here after paying
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  stripe:
    # from .env; both empty = the built-in test payment page is used (dev only)
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

---
# ---------- dev: your laptop (MySQL + Mailpit in Docker) ----------
spring:
  config:
    activate:
      on-profile: dev
    # read MYSQL_USER / MYSQL_PASSWORD from the project's .env file (not on GitHub)
    import: optional:file:../.env[.properties]
  datasource:
    # tests do NOT use this: they start their own MySQL (Testcontainers, see MySqlTestDatabase)
    url: jdbc:mysql://localhost:3306/eventhub
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    show-sql: true
  mail:
    host: localhost
    port: 1025              # Mailpit: see emails at http://localhost:8025
app:
  jwt:
    # from .env (JWT_SECRET); the fallback lets tests and CI run, and must never be used in prod
    secret: ${JWT_SECRET:dev-only-secret-not-for-production-0123456789}
  demo:
    # from .env (DEMO_PASSWORD): creates the demo accounts (DevDataSeeder); empty = none
    password: ${DEMO_PASSWORD:}

---
# ---------- prod: real server (values come from environment variables) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}   # only used when MAIL_ENABLED=true
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
app:
  jwt:
    secret: ${JWT_SECRET}   # required: the app refuses to start without it
  cookie:
    secure: true
  mail:
    enabled: ${MAIL_ENABLED:false}   # no mail account on the free demo server: bell only
  payments:
    # true only on a public DEMO server without Stripe keys: shows the "TEST PAYMENT - no real money" page
    test-page-allowed: ${PAYMENTS_TEST_PAGE:false}
  demo:
    # demo accounts on the server only if this secret is set (long, private password); empty = none
    password: ${DEMO_PASSWORD:}
