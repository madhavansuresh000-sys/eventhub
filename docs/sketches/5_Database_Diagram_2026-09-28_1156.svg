<text x="45" y="425" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" font-weight="bold">How to read it</text>
<text x="45" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">PK = primary key: unique number for each row (like a roll number)</text>
<text x="45" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">FK = foreign key: points to a row in another table</text>
<text x="45" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">1 ----&lt; many : one user has many bookings; one event has many bookings</text>
<text x="45" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">role: STUDENT / ORGANIZER / ADMIN</text>
<text x="45" y="522" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">bookings.status: HELD / CONFIRMED / CANCELLED / WAITLIST / ATTENDED</text>
<text x="45" y="540" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">hold_expires_at: seat hold ends after 10 minutes (feature 1)</text>
<text x="45" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">events.version: stops two people buying the last seat (feature 1)</text>
<text x="30" y="605" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B45309" text-anchor="start" font-style="italic">Later phases add: waitlist order, approvals, certificates, categories.</text>
